version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/daed.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: daed
build:
  run_buildscript: false
images:
  - id: daed
    target: service
    service: daed
    source: ghcr.io/daeuniverse/daed
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
stores:
  official:
    enabled: false
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: daed
    summary: "dae 的现代化 Web 管理面板，高性能透明代理解决方案"
